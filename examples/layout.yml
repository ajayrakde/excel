# One YAML file describes one existing workbook.
sheets:
  A:
    # Named cells: demonstrate every supported value category.
    customerName:
      type: cell
      range: B1
    approved:
      type: cell
      range: B2
    itemCount:
      type: cell
      range: B3
    discount:
      type: cell
      range: B4
    optionalNote:
      type: cell
      range: B5

    # One horizontal range. Consumer code supplies exactly three values.
    summary:
      type: row
      range: E1:G1

    # One vertical range. Consumer code supplies exactly ten values.
    prices:
      type: col
      range: H1:H10

    # Existing workbook header is A6:C6. Data starts at A7.
    # YAML headers enable order-independent named values.
    items:
      type: table
      range: A6:C6
      hasHeader: true
      limit: 5
      headers: [number, itemName, price]

    # No workbook header, row limit, or YAML header names.
    # Data starts at E6 and must be supplied positionally.
    rawRows:
      type: table
      range: E6:G6
      hasHeader: false

  B:
    status:
      type: cell
      range: B1

    # Existing workbook header, positional values, and unlimited data rows.
    archivedItems:
      type: table
      range: A3:C3
      hasHeader: true

    # Logical YAML headers without a header row in the workbook.
    measurements:
      type: table
      range: E3:F3
      hasHeader: false
      limit: 3
      headers: [label, value]
